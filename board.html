<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本週排班 — DN Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   本週排班板
   規劃用的桌機介面。原本 12 張副本卡疊成 10 個螢幕高，改成一塊板：
   橫列＝副本、直行＝成員，一個螢幕看完整週。

   配色：中性炭灰＋骨白做結構，火水光暗四個屬性色是整頁唯一的飽和色，
   顏色只用來承載資料。已完成的往後退成灰，讓「還沒打的」自己跳出來。
   =================================================================== */
:root{
  --ground:#15151a; --surface:#1d1d24; --raised:#26262f; --rule:#34343f;
  --ink:#eceaf2; --muted:#8d8a99; --bone:#e3d9c2; --done:#575c68;
  --fire:#ff7a45; --water:#45b8ff; --light:#ffc94d; --dark:#a86bff;
  --alert:#ff4d4d;
  --ui:"Archivo Narrow","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px}
body{padding-bottom:40vh}
a{color:var(--bone)}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

/* ---- 頂 ---- */
.top{position:sticky;top:0;z-index:30;background:var(--ground);
     border-bottom:1px solid var(--rule);padding:14px 22px 0}
.top-row{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.brand{font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.left{font-family:var(--num);font-size:40px;font-weight:600;line-height:1;color:var(--bone)}
.left small{font-family:var(--ui);font-size:15px;font-weight:600;
            color:var(--muted);margin-left:10px}
.week{font-size:14px;color:var(--muted)}
.grow{flex:1}
nav{display:flex;gap:2px}
nav a{padding:7px 14px;text-decoration:none;color:var(--muted);font-size:15px;
      font-weight:600;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--bone);border-bottom-color:var(--bone)}
.bar{height:3px;background:var(--rule);margin-top:12px}
.bar i{display:block;height:100%;background:var(--bone);transition:width .4s ease}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 0 12px}
button{font-family:var(--ui);font-size:14px;font-weight:600;
       background:transparent;color:var(--muted);border:1px solid var(--rule);
       padding:6px 13px;cursor:pointer;border-radius:3px}
button:hover{color:var(--ink);border-color:var(--muted)}
button.on{background:var(--bone);border-color:var(--bone);color:#1a1a1f}
.dot{width:7px;height:7px;border-radius:50%;background:var(--done);display:inline-block;margin-right:7px}
.dot.live{background:var(--bone)}
.dot.busy{background:var(--water)}
.dot.dirty{background:var(--fire)}

/* ---- 板 ---- */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-weight:600;font-size:14px;color:var(--muted);text-align:left;
          padding:9px 12px;border-bottom:1px solid var(--rule);
          position:sticky;top:var(--topH,126px);background:var(--ground);z-index:10}
.board td{border-bottom:1px solid var(--rule);padding:7px 12px;vertical-align:top}
.board tr:hover td{background:#1a1a20}
.board tr.sel td{background:var(--surface)}
.board tr.clear td{opacity:.45}
.board tr.first td{border-top:1px solid var(--rule)}   /* 副本之間的分界 */
.board td{border-bottom:1px solid #232329}
.tno{width:52px;font-family:var(--num);font-size:13px;color:var(--muted);white-space:nowrap}
.tno b{color:var(--bone);font-weight:600}
.tno.rest{color:#4a4a55}
.dun{width:168px;cursor:pointer;white-space:nowrap;vertical-align:top;padding-top:10px}
.dun b{font-size:16px;font-weight:600;color:var(--ink)}
.dun em{font-style:normal;font-family:var(--num);font-size:11px;color:var(--muted);
        display:block;margin-top:3px;letter-spacing:.06em}
.board tr.sel .dun b{color:var(--bone)}
.cell{min-width:132px}
.need{width:74px;text-align:right;font-family:var(--num);font-size:15px;color:var(--muted)}
.need b{color:var(--fire);font-weight:600}

/* 角色籌碼：屬性色只出現在這裡 */
.chip{display:inline-flex;align-items:center;gap:6px;margin:2px 4px 2px 0;padding:4px 9px;
      border:1px solid var(--rule);border-radius:3px;cursor:grab;user-select:none;line-height:1.3;
      background:var(--surface);white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip.drag{opacity:.4}
.chip.hit{border-color:var(--bone);background:var(--raised)}
.chip.no{opacity:.25}
.chip .t{font-family:var(--num);font-size:10px;color:var(--muted)}
.chip .n{font-size:14px;font-weight:600}
.chip.e-火 .n{color:var(--fire)} .chip.e-水 .n{color:var(--water)}
.chip.e-光 .n{color:var(--light)} .chip.e-暗 .n{color:var(--dark)}
.chip.done{background:transparent;border-color:#2a2a33;color:var(--done)}
.chip.done .n{color:var(--done);text-decoration:line-through}
.chip.done .t{color:#3d414b}
.chip.bench{border-style:dashed;opacity:.75}
.chip .r{font-size:10px;color:var(--muted);letter-spacing:.05em}
.empty{color:#33333c;font-size:13px}

/* ---- 抽屜 ---- */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,92vw);background:var(--surface);
        border-left:1px solid var(--rule);z-index:40;overflow-y:auto;padding:20px 22px 60px;
        transform:translateX(100%);transition:transform .22s ease;box-shadow:-20px 0 50px #0007}
.drawer.open{transform:none}
.drawer h2{font-size:22px;margin:0 0 3px;font-weight:600}
.drawer .sub{font-family:var(--num);font-size:12px;color:var(--muted);letter-spacing:.06em}
.x{position:absolute;top:16px;right:18px}
.team{border:1px solid var(--rule);margin-top:14px}
.team h3{margin:0;padding:9px 12px;font-size:14px;font-weight:600;
         color:var(--ink);background:var(--raised);
         display:flex;justify-content:space-between;gap:10px}
.team h3 span{font-family:var(--num);color:var(--bone);letter-spacing:0}
.slot{display:flex;align-items:center;gap:9px;padding:7px 12px;border-top:1px solid #2a2a33;
      cursor:grab;user-select:none}
.slot:hover{background:var(--raised)}
.slot.drag{opacity:.4}
.slot.hit{background:var(--raised);box-shadow:inset 2px 0 0 var(--bone)}
.slot.no{opacity:.25;cursor:default}
.slot .who{width:48px;color:var(--muted);font-size:12px;flex:none}
.slot .nm{flex:1;font-weight:600}
.slot .pw{font-family:var(--num);font-size:12px;color:var(--muted)}
.slot.open{color:#4a4a55;font-style:italic;font-size:13px;border-top:1px dashed #2a2a33}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--rule);
      font-size:13.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--ink);font-weight:600}
.note.alert{border-left-color:var(--alert)}
.tag{font-family:var(--num);font-size:10px;letter-spacing:.06em;padding:1px 5px;
     border:1px solid var(--rule);color:var(--muted)}
.tag.own{color:var(--bone);border-color:var(--bone);letter-spacing:0;font-family:var(--ui);vertical-align:2px}
.ownbar{margin:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ownbar .hint{font-size:12.5px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:#0009;z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.foot{padding:16px 22px;color:var(--muted);font-size:13px;line-height:1.8}
@media(max-width:900px){
  .board th{position:static}
  .dun{width:auto}
  .chip{padding:7px 10px}          /* 手機上放大到好點 */
}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
       background:var(--raised);border:1px solid var(--alert);color:var(--ink);
       padding:11px 18px;border-radius:4px;font-size:14.5px;max-width:92vw;z-index:60;
       box-shadow:0 10px 34px #000a;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <span class="brand">DN Helper</span>
    <div><div class="left" id="left">—</div></div>
    <div class="week" id="week"></div>
    <span class="grow"></span>
    <nav id="nav"></nav>
  </div>
  <div class="bar"><i id="barfill" style="width:0"></i></div>
  <div class="tools">
    <button id="fOpen" onclick="setFilter('open')">還沒打完</button>
    <button id="fAll" onclick="setFilter('all')">全部</button>
    <span style="width:10px"></span>
    <button onclick="regen()">重新分團</button>
    <button onclick="Sync.pull().then(draw)"><span class="dot" id="sdot"></span><span id="stxt">同步</span></button>
    <span class="grow"></span>
    <span class="week" id="hint">點角色＝標記打完 · 拖角色＝換團 · 點副本名＝看細節</span>
  </div>
</div>

<table class="board"><thead id="bhead"></thead><tbody id="bbody"></tbody></table>

<div class="foot" id="foot"></div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><button class="x" onclick="closeDrawer()">關閉</button><div id="dbody"></div></aside>

<script src="shared.js?v=202608222202"></script>
<script src="lineup.js?v=202608222202"></script>
<script>
/* ---------------- 狀態 ---------------- */
let filter = 'open';        // open = 只看這週還沒打完的副本
let openDun = null;

const WD=['週日','週一','週二','週三','週四','週五','週六'];
document.getElementById('nav').innerHTML =
  [['board.html','排班'],['roster.html','角色'],['raid.html','舊版分團'],['index.html','深淵']]
  .map(x=>'<a href="'+x[0]+'"'+(x[0]==='board.html'?' class="on"':'')+'>'+x[1]+'</a>').join('');

function setFilter(f){ filter=f; draw(); }

/* ---------------- 一格：某人在某本的所有角色 ---------------- */
// 打完的人已經被 pruneCleared 從編組移除，所以要自己把三種狀態併起來：
// 已打完的、排在第幾團的、還沒排進團的
function statesOf(p, d){
  const L = lineupFor(d.key, d.size);
  return p.chars.filter(c=>c.active).map(function(c){
    let team = -1;
    L.forEach(function(t,i){ if(t.some(s=>s.c.id===c.id)) team=i; });
    return { c:c, done:isCleared(c.id,d.key), team:team };
  });
}

function chip(p, c, d, st){
  const e = elemOf(c);
  const drag = (!st.done && st.team>=0);      // 已打完或沒排進團的不能拖
  return '<span class="chip '+(st.done?'done':(st.team<0?'bench':''))+(e?' e-'+e:'')+'"'
    + (drag?' draggable="true"':'')
    + ' data-c="'+c.id+'" data-d="'+d.key+'" data-team="'+st.team+'"'
    + ' title="'+esc(p.name+' · '+charLabel(p,c))
    + (st.done?'（本週已打，點一下取消）':(st.team>=0?'（第 '+(st.team+1)+' 團，可拖到同列其他人身上換團）':'（沒排進團）'))+'">'
    // 團號不用印在籌碼上，列本身就是團；只有「已打／未排」那列需要標記
    + (st.done ? '<span class="t">✓</span>' : (st.team<0 ? '<span class="t">未排</span>' : ''))
    + '<span class="n">'+esc(charLabel(p,c))+'</span>'
    + '</span>';
}

/* ---------------- 換團的規則 ----------------
   唯一的硬規則：同一個人不能在同一團出現兩次。                        */
function swapTeams(dk, cidA, cidB){
  const L=lineupOf(dk); if(!L.length) return '編組還沒建立。';
  let a=null,b=null;
  L.forEach(function(t,ti){ t.forEach(function(s,si){
    if(s.c.id===cidA) a={t:ti,i:si,s:s};
    if(s.c.id===cidB) b={t:ti,i:si,s:s};
  });});
  if(!a||!b) return '這兩隻不在同一個副本的編組裡。';
  if(a.t===b.t) return '他們本來就同一團。';
  const hitB=L[b.t].some((x,k)=>k!==b.i && x.p.id===a.s.p.id);
  if(hitB) return esc(a.s.p.name)+' 已經在第 '+(b.t+1)+' 團了，換過去會有兩隻。';
  const hitA=L[a.t].some((x,k)=>k!==a.i && x.p.id===b.s.p.id);
  if(hitA) return esc(b.s.p.name)+' 已經在第 '+(a.t+1)+' 團了，換過來會有兩隻。';
  L[a.t][a.i]=b.s; L[b.t][b.i]=a.s;
  persistLineup(dk); return '';
}
// 抽屜用：把某個位子移到另一團的空位
function moveToTeam(dk, size, t1, i1, t2){
  const L=lineupOf(dk);
  if(t1===t2) return '';
  if(L[t2].length>=capOf(size)) return '第 '+(t2+1)+' 團已經滿 '+capOf(size)+' 人了。';
  const a=L[t1][i1];
  if(L[t2].some(x=>x.p.id===a.p.id)) return esc(a.p.name)+' 已經在第 '+(t2+1)+' 團了。';
  L[t1].splice(i1,1); L[t2].push(a);
  if(!L[t1].length) L.splice(t1,1);
  persistLineup(dk); return '';
}
let toastTimer=null;
function toast(msg){
  if(!msg) return;
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.innerHTML=msg; el.className='show';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.className=''; },3600);
}

/* ---------------- 板 ---------------- */
function draw(){
  POWCACHE=null;
  const people = DB.people.filter(p=>p.active && p.chars.some(c=>c.active));
  const duns = DB.dungeons.filter(function(d){
    if(filter==='all') return true;
    return allChars(true).some(r=>!isCleared(r.c.id,d.key));
  });

  document.getElementById('bhead').innerHTML =
    '<tr><th>副本</th><th>團</th>' + people.map(p=>'<th>'+esc(p.name)+'</th>').join('')
    + '<th style="text-align:right">外援</th></tr>';

  let todo=0, done=0, recruits=0;
  const rows = duns.map(function(d){
    const L = lineupFor(d.key, d.size);
    const need = L.reduce((n,t)=>n+Math.max(0,d.size-t.length),0);
    recruits += need;
    const allDone = allChars(true).every(r=>isCleared(r.c.id,d.key));
    const sel = openDun===d.key ? ' sel' : '';

    // 團的組合跨副本一致；這本打完的人留在原位灰掉。
    // 「未排」列只收沒被排進任何團的
    const rest = {};
    people.forEach(function(p){
      rest[p.id] = statesOf(p,d).filter(x=>x.team<0);
      statesOf(p,d).forEach(x=>{ x.done ? done++ : todo++; });
    });
    const hasRest = people.some(p=>rest[p.id].length);
    const lines = L.length + (hasRest?1:0) || 1;

    let out='';
    L.forEach(function(team, ti){
      // 這本的外援 = 空位 + 已打不來的人
      const absent = team.filter(s=>isCleared(s.c.id,d.key)).length;
      const open = Math.max(0, d.size - team.length + absent);
      let tds='';
      people.forEach(function(p){
        const mine = team.filter(s=>s.p.id===p.id);   // 同一團一個人最多一隻
        tds += '<td class="cell">' + (mine.length
          ? chip(p, mine[0].c, d, {done:isCleared(mine[0].c.id,d.key), team:ti})
          : '<span class="empty">·</span>') + '</td>';
      });
      out += '<tr class="'+(ti===0?'first ':'')+(allDone?'clear ':'')+sel+'" data-row="'+d.key+'">'
        + (ti===0 ? '<td class="dun" rowspan="'+lines+'" data-open="'+d.key+'"><b>'+esc(d.name)+'</b>'
                    + (isOwnLineup(d.key)?' <span class="tag own">獨立</span>':'')
                    + '<em>'+d.size+' 人 · '+L.length+' 團</em></td>' : '')
        + '<td class="tno"><b>'+(ti+1)+'</b></td>'
        + tds
        + '<td class="need">'+(open?'<b>'+open+'</b>':'0')+'</td></tr>';
    });

    if(hasRest){
      let tds='';
      people.forEach(function(p){
        tds += '<td class="cell">' + (rest[p.id].length
          ? rest[p.id].map(x=>chip(p,x.c,d,x)).join('')
          : '<span class="empty">·</span>') + '</td>';
      });
      out += '<tr class="'+(allDone?'clear ':'')+sel+'" data-row="'+d.key+'">'
        + (L.length===0 ? '<td class="dun" rowspan="1" data-open="'+d.key+'"><b>'+esc(d.name)+'</b>'
                          + (isOwnLineup(d.key)?' <span class="tag own">獨立</span>':'')
                          + '<em>'+d.size+' 人</em></td>' : '')
        + '<td class="tno rest">未排</td>' + tds + '<td class="need">—</td></tr>';
    }
    return out;
  }).join('');

  document.getElementById('bbody').innerHTML = rows ||
    '<tr><td colspan="10" style="padding:40px 12px;color:var(--muted)">本週全部打完了。</td></tr>';

  document.getElementById('left').innerHTML = todo + '<small>場沒打</small>';
  document.getElementById('week').textContent =
    curWeek() + ' 起 · 每' + WD[DB.cfg.resetDay] + '重置 · 要找 ' + recruits + ' 人次外援';
  const total = todo+done;
  document.getElementById('barfill').style.width = total ? (done/total*100)+'%' : '0';
  document.getElementById('fOpen').className = filter==='open' ? 'on' : '';
  document.getElementById('fAll').className  = filter==='all'  ? 'on' : '';
  document.getElementById('foot').innerHTML =
    '本週還要打 <b style="color:var(--ink)">'+todo+'</b> 場，已完成 '+done+' 場。'
    + '<b style="color:var(--ink)">一列就是一團，而且 4 人本全部共用同一套團、8 人本也是</b>——'
    + '不同副本不會換隊友。灰掉刪除線＝這本打完了，那格這本要找外援補。'
    + '拖角色到另一列＝兩人互換團（<b style="color:var(--ink)">所有同人數的副本一起變</b>）。'
    + '某本要特別配置的話，點副本名 → 「這本單獨調整」，那本就脫鉤成自己一份（標「獨立」），拖動只影響它。'
    + '副本、角色、裝備在<a href="roster.html">角色</a>頁編輯。';
  if(openDun) drawDrawer(openDun);
  if(typeof fixTop==='function') fixTop();
}

const board=document.querySelector('.board');
board.addEventListener('click', function(e){
  const open = e.target.closest('[data-open]');
  if(open){ openDrawer(open.dataset.open); return; }
  const ch = e.target.closest('.chip');
  if(ch){ setCleared(ch.dataset.c, ch.dataset.d, !isCleared(ch.dataset.c, ch.dataset.d)); draw(); }
});

// 板上拖曳：只在同一列（同一本）之間有意義，拖到誰身上就跟誰換團
let dragChip=null;
board.addEventListener('dragstart', function(e){
  const ch=e.target.closest('.chip[draggable]'); if(!ch) return;
  dragChip=ch; ch.classList.add('drag');
  try{ e.dataTransfer.setData('text/plain','1'); e.dataTransfer.effectAllowed='move'; }catch(_){}
  // 同一列裡不能換的先變暗，省得試了才知道
  board.querySelectorAll('.chip[data-d="'+ch.dataset.d+'"]').forEach(function(o){
    if(o===ch) return;
    if(o.dataset.team==='-1'||o.classList.contains('done')||o.dataset.team===ch.dataset.team)
      o.classList.add('no');
  });
});
board.addEventListener('dragend', function(){
  dragChip=null;
  board.querySelectorAll('.drag,.hit,.no').forEach(el=>el.classList.remove('drag','hit','no'));
});
board.addEventListener('dragover', function(e){
  const ch=e.target.closest('.chip'); if(!ch||!dragChip) return;
  if(ch.dataset.d!==dragChip.dataset.d||ch===dragChip||ch.classList.contains('no')) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; ch.classList.add('hit');
});
board.addEventListener('dragleave', function(e){
  const ch=e.target.closest('.chip'); if(ch) ch.classList.remove('hit');
});
board.addEventListener('drop', function(e){
  const ch=e.target.closest('.chip'); if(!ch||!dragChip) return;
  e.preventDefault();
  if(ch.dataset.d!==dragChip.dataset.d){ toast('只能在同一個副本裡換團。'); return; }
  const err=swapTeams(dragChip.dataset.d, dragChip.dataset.c, ch.dataset.c);
  dragChip=null;
  if(err) toast(err); else draw();
});

/* ---------------- 抽屜：一本的分團細節 ---------------- */
function openDrawer(dk){
  openDun=dk;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('on');
  drawDrawer(dk); draw();
}
function closeDrawer(){
  openDun=null;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
  draw();
}
function drawDrawer(dk){
  const d=DB.dungeons.find(x=>x.key===dk); if(!d) return;
  const L=lineupFor(d.key,d.size);
  const own=isOwnLineup(d.key);
  let h='<h2>'+esc(d.name)+(own?' <span class="tag own">獨立</span>':'')+'</h2>'
      + '<div class="sub">'+d.size+' 人本 · '+L.length+' 團 · 建議戰力/人 '
      + '<input type="number" value="'+(d.req||0)+'" data-req="'+d.key+'" '
      + 'style="width:80px;background:var(--raised);border:1px solid var(--rule);color:var(--ink);'
      + 'font-family:var(--num);padding:2px 6px"></div>'
      + '<div class="ownbar">'
      + (own
          ? '<button data-own="attach">回到共用編組</button><span class="hint">這本現在是自己一份，拖動只影響這本。</span>'
          : '<button data-own="detach">這本單獨調整</button><span class="hint">目前跟其他 '+d.size+' 人本共用同一套團；按了會複製一份出來，只改這本。</span>')
      + '</div>';

  L.forEach(function(slots,i){
    const active=slots.filter(s=>!isCleared(s.c.id,d.key));   // 這本會到的人
    const open=Math.max(0,d.size-active.length);
    const pw=active.reduce((n,s)=>n+effPowerOf(s.c),0);
    const nHeal=active.filter(s=>isHealer(s.c)).length;
    const nTank=active.filter(s=>isTank(s.c)).length;
    h+='<div class="team"><h3>第 '+(i+1)+' 團 <span>'+slots.length+'/'+d.size+' · '+pw+'</span></h3>';
    slots.forEach(function(s,si){
      const e=elemOf(s.c), k=roleKind(s.c);
      const dn=isCleared(s.c.id,d.key);
      h+='<div class="slot" draggable="true" data-t="'+i+'" data-i="'+si+'"'
        +(dn?' style="opacity:.45"':'')+'>'
        +'<span class="who">'+esc(s.p.name)+'</span>'
        +'<span class="nm'+(e?' ':'')+'" style="'+(e?'color:var(--'+({'火':'fire','水':'water','光':'light','暗':'dark'}[e])+')':'')+'">'
        +esc(charLabel(s.p,s.c))+'</span>'
        +(k!=='輸出'?'<span class="tag">'+(k==='補師'?'補':'坦')+'</span>':'')
        +(dn?'<span class="tag">已打</span>':'')
        +'<span class="pw">'+effPowerOf(s.c)+'</span></div>';
    });
    for(let k=0;k<open;k++) h+='<div class="slot open" data-t="'+i+'" data-empty="1">待補外援</div>';
    const lack=[]; if(!nHeal) lack.push('補'); if(!nTank) lack.push('坦');
    if(open||lack.length){
      h+='<div class="note'+(lack.length?' alert':'')+'">'
        +(open?'還缺 <b>'+open+'</b> 人。':'')
        +(lack.length?' 團裡沒有 <b>'+lack.join('、')+'</b>。':'')
        +'</div>';
    }
    h+='</div>';
  });

  if(d.req){
    const worst=L.map(function(t,i){
      const act=t.filter(s=>!isCleared(s.c.id,d.key));
      const have=act.reduce((n,s)=>n+effPowerOf(s.c),0)+Math.max(0,d.size-act.length)*d.req;
      return {i:i, gap:d.req*d.size-have};
    }).filter(x=>x.gap>0);
    if(worst.length) h+='<div class="note alert">戰力不足：'
      + worst.map(x=>'第 '+(x.i+1)+' 團差 <b>'+Math.round(x.gap)+'</b>').join('、')
      + '。優先升團裡最低的那幾隻，或把外援門檻拉高。</div>';
  }
  document.getElementById('dbody').innerHTML=h;
}
/* 抽屜拖曳：位子拖到位子＝互換，拖到「待補外援」＝移過去 */
const drawerEl=document.getElementById('drawer');
let dragSlot=null;
drawerEl.addEventListener('dragstart', function(e){
  const sl=e.target.closest('.slot[draggable]'); if(!sl) return;
  dragSlot=sl; sl.classList.add('drag');
  try{ e.dataTransfer.setData('text/plain','1'); e.dataTransfer.effectAllowed='move'; }catch(_){}
});
drawerEl.addEventListener('dragend', function(){
  dragSlot=null;
  drawerEl.querySelectorAll('.drag,.hit').forEach(el=>el.classList.remove('drag','hit'));
});
drawerEl.addEventListener('dragover', function(e){
  const sl=e.target.closest('.slot'); if(!sl||!dragSlot||sl===dragSlot) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; sl.classList.add('hit');
});
drawerEl.addEventListener('dragleave', function(e){
  const sl=e.target.closest('.slot'); if(sl) sl.classList.remove('hit');
});
drawerEl.addEventListener('drop', function(e){
  const sl=e.target.closest('.slot'); if(!sl||!dragSlot||sl===dragSlot) return;
  e.preventDefault();
  const d=DB.dungeons.find(x=>x.key===openDun); if(!d) return;
  const L=lineupOf(openDun);
  const t1=+dragSlot.dataset.t, i1=+dragSlot.dataset.i, t2=+sl.dataset.t;
  let err='';
  if(sl.dataset.empty){
    err=moveToTeam(openDun, d.size, t1, i1, t2);
  }else{
    const a=L[t1][i1], b=L[t2][+sl.dataset.i];
    err=swapTeams(openDun, a.c.id, b.c.id);
  }
  dragSlot=null;
  if(err) toast(err); else draw();
});

drawerEl.addEventListener('click', function(e){
  const b=e.target.closest('button[data-own]'); if(!b||!openDun) return;
  const d=DB.dungeons.find(x=>x.key===openDun); if(!d) return;
  if(b.dataset.own==='detach') detachLineup(d.key, d.size);
  else if(confirm('丟掉這本自己的編組，回到跟其他 '+d.size+' 人本共用？')) attachLineup(d.key);
  else return;
  draw();
});
drawerEl.addEventListener('change', function(e){
  const k=e.target.dataset.req; if(!k) return;
  const d=DB.dungeons.find(x=>x.key===k); if(!d) return;
  d.req=Math.max(0,+e.target.value||0); touchMeta(); saveDB(); drawDrawer(k);
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape'&&openDun) closeDrawer(); });

function regen(){ if(confirm('重新分團？手動調整過的編組會被重排，同人數的副本會一起變，單獨調整過的副本也會回到共用。')){ regenLineups(); draw(); } }

/* ---------------- 同步狀態 ---------------- */
Sync.onChange(function(st){
  const dot=document.getElementById('sdot'), txt=document.getElementById('stxt');
  if(!dot) return;
  dot.className='dot'+(st.busy?' busy':st.dirty?' dirty':st.ok?' live':'');
  txt.textContent = st.busy?'同步中':st.dirty?'未上傳':st.ok?'已同步':'未設定';
});
if(Sync.ready()){ Sync.pull(true).then(draw); Sync.startPolling(Sync.status().canWrite?60:240); }
window.onSynced=draw;

// 頂列會因視窗寬度折行變高，凍結位置要實測，寫死會疊到內容上
function fixTop(){
  const t=document.querySelector('.top');
  if(t) document.documentElement.style.setProperty('--topH', t.offsetHeight+'px');
}
window.addEventListener('resize', fixTop);

draw(); fixTop();
</script>
</body>
