<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板子任務 — DN Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   板子任務 v3
   一張板子＝一張卡，不是表格列。空板縮成小虛線卡不佔注意力，
   有用的板子才展開成完整卡片。
   顏色紀律：內文一律亮字、標籤一種灰、數字米白；
   紅只給「限時／超額」、藍只給「分享」，其他一律不上色。
   =================================================================== */
:root{
  --ground:#141419; --surface:#1e1e26; --raised:#282833; --rule:#34343f;
  --ink:#ecebf1; --sub:#a7a4b3; --faint:#5b5f6b; --bone:#e3d9c2;
  --fire:#ff7a45; --water:#52b9ff; --alert:#ff5252;
  --ui:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px}
body{padding-bottom:25vh}
a{color:var(--bone)}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

/* ---- 頂 ---- */
.top{position:sticky;top:0;z-index:30;background:var(--ground);
     border-bottom:1px solid var(--rule);padding:12px 22px}
.top-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
.left{font-family:var(--num);font-size:34px;font-weight:600;line-height:1;color:var(--bone)}
.left small{font-family:var(--ui);font-size:14px;font-weight:500;color:var(--sub);margin-left:8px}
.week{font-size:13.5px;color:var(--sub)}
.grow{flex:1}
nav{display:flex;gap:2px}
nav a{padding:6px 13px;text-decoration:none;color:var(--sub);font-size:15px;
      font-weight:600;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--bone);border-bottom-color:var(--bone)}
button{font-family:var(--ui);font-size:14px;font-weight:600;background:transparent;
       color:var(--sub);border:1px solid var(--rule);padding:5px 12px;cursor:pointer;border-radius:4px}
button:hover{color:var(--ink);border-color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:6px}
.dot.live{background:var(--bone)} .dot.busy{background:var(--water)} .dot.dirty{background:var(--fire)}

/* ---- 道具合計：一排小膠囊 ---- */
.totals{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px 0;align-items:center}
.tchip{border:1px solid var(--rule);border-radius:4px;padding:5px 11px;font-size:14px}
.tchip b{font-weight:600}
.tchip .n{font-family:var(--num);color:var(--bone);margin-left:7px}
.tlabel{font-size:13px;color:var(--sub)}

/* ---- 一列一個人：左邊名字，右邊 6 格 ---- */
section{padding:0 22px}
.prow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #24242e}
.pname{width:112px;flex:none;padding-top:8px}
.pname .who{display:block;font-size:12px;color:var(--sub);margin-bottom:1px}
.pname h2{margin:0;font-size:16.5px;font-weight:700}
.pname .st{display:block;font-family:var(--num);font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6}
.pname .st b{color:var(--bone);font-weight:600}
.pname .over{display:block;color:var(--alert);font-weight:700;font-size:12.5px;margin-top:2px}
.allbtn{margin-top:6px;padding:2px 10px;font-size:12.5px;border-radius:99px}
.allbtn.on{color:var(--ground);background:var(--bone);border-color:var(--bone);font-weight:700}
.cards{display:flex;gap:8px;flex-wrap:wrap;flex:1}

/* ---- 空板：安靜的＋方格，點一下直接彈選單 ---- */
.slot0{position:relative;width:96px;min-height:96px;border:1px dashed #2e2e3a;border-radius:6px;
       display:flex;align-items:center;justify-content:center;color:#45454f;font-size:22px;
       font-weight:300;cursor:pointer;transition:border-color .12s,color .12s}
.slot0:hover{border-color:var(--sub);color:var(--sub)}
.slot0 select.ghost{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ---- 有料的板子卡 ---- */
.card{width:236px;border:1px solid #303040;border-radius:6px;background:var(--surface);
      padding:9px 11px 8px;display:flex;flex-direction:column;gap:6px}
.card.done{opacity:.42}
.card.done .iname{text-decoration:line-through}
.crow{display:flex;align-items:center;gap:8px}
/* 獎勵名：點名字本身就能改（隱形 select 蓋在上面） */
.iname{position:relative;font-size:15.5px;font-weight:700;flex:1;cursor:pointer;line-height:1.4}
.iname:hover{color:var(--bone)}
.iname select.ghost{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* 控件一律無邊框，靠底線與顏色 */
select{background:transparent;color:var(--ink);border:0;border-bottom:1px dashed #3a3a46;
       border-radius:0;padding:2px 2px;font-family:var(--ui);font-size:13.5px;max-width:100%;cursor:pointer}
select:hover{border-bottom-color:var(--sub)}
select.unset{color:var(--alert)}
/* 一次／限時：文字切換 */
.seg{display:inline-flex;gap:2px;flex:none}
.seg button{border:0;padding:2px 7px;font-size:13px;color:var(--faint);border-radius:4px}
.seg button:hover{color:var(--sub)}
.seg button.on{color:var(--ink);background:var(--raised)}
.seg button.on.timed{color:var(--fire)}
/* 分享：小名字膠囊 */
.shrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.shbtn{font-size:12px;padding:1px 8px;border-radius:99px;border-color:#2e2e3a;color:var(--faint)}
.shbtn:hover{color:var(--sub);border-color:var(--sub)}
.shbtn.on{color:var(--water);border-color:var(--water)}
/* 破了 */
.donebtn{padding:3px 10px;font-size:13px;flex:none;border-radius:99px}
.donebtn.on{color:var(--ground);background:var(--bone);border-color:var(--bone);font-weight:700}

/* ---- 照副本看 ---- */
h3.sec{font-size:15px;font-weight:700;color:var(--sub);margin:26px 22px 8px;
       padding-top:16px;border-top:1px solid var(--rule)}
.byrun{padding:0 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.run{border:1px solid var(--rule);border-radius:6px;padding:11px 13px;background:var(--surface)}
.run h4{margin:0 0 7px;font-size:16px;font-weight:700;display:flex;justify-content:space-between}
.run h4 span{font-family:var(--num);font-size:12.5px;color:var(--sub);font-weight:400}
.run .b{font-size:14px;padding:2.5px 0;line-height:1.55}
.run .b .own{color:var(--sub)}
.run .b .sh{color:var(--water)}
.run .b .timed{color:var(--fire);font-size:12.5px;border:1px solid var(--fire);
               border-radius:3px;padding:0 5px;margin-left:5px}
.foot{padding:18px 22px;color:var(--sub);font-size:13.5px;line-height:1.9}
@media(max-width:620px){ .card{width:100%} .prow{flex-direction:column;gap:8px} .pname{width:auto;display:flex;gap:12px;align-items:baseline} }
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <span class="brand">DN Helper</span>
    <div class="left" id="left">—</div>
    <div class="week" id="week"></div>
    <span class="grow"></span>
    <nav id="nav"></nav>
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
    <button onclick="Sync.pull().then(draw)"><span class="dot" id="sdot"></span><span id="stxt">同步</span></button>
    <button onclick="clearWeekBoard()">清空本週</button>
    <span class="week">每隻角色每週 6 張 · 沒用的留著「空」就好 · 一張最多分享 3 個隊友</span>
  </div>
</div>

<div class="totals" id="totals"></div>
<div id="people"></div>

<h3 class="sec">照副本看 —— 出發前看這裡，順路一次帶掉</h3>
<div class="byrun" id="byrun"></div>

<div class="foot" id="foot"></div>

<script src="shared.js"></script>
<script>
document.getElementById('nav').innerHTML =
  [['board.html','排班'],['tasks.html','板子'],['roster.html','角色'],['index.html','深淵']]
  .map(x=>'<a href="'+x[0]+'"'+(x[0]==='tasks.html'?' class="on"':'')+'>'+x[1]+'</a>').join('');

const WD=['週日','週一','週二','週三','週四','週五','週六'];
const people = () => DB.people.filter(p=>p.active);

function itemGhost(pid,i,val){
  return '<select class="ghost" data-p="'+pid+'" data-i="'+i+'" data-f="item">'
    +'<option value="">'+(val?'作廢（改成空）':'')+'</option>'
    +BOARD_ITEMS.map(k=>'<option'+(k===val?' selected':'')+'>'+esc(k)+'</option>').join('')
    +'</select>';
}

function card(r,b,i){
  const cid=r.c.id;
  if(!b.item){
    // 空板＝安靜的＋方格；隱形選單蓋滿整格，點哪都直接彈選項
    return '<div class="slot0" title="登記這張板子">＋'+itemGhost(cid,i,'')+'</div>';
  }
  const ps=people();
  return '<div class="card'+(b.done?' done':'')+'">'
    +'<div class="crow">'
      +'<span class="iname" title="點名字改獎勵或作廢">'+esc(b.item)+itemGhost(cid,i,b.item)+'</span>'
      +'<button class="donebtn'+(b.done?' on':'')+'" data-p="'+cid+'" data-i="'+i+'" data-f="done">'
        +(b.done?'✓ 破了':'沒破')+'</button>'
    +'</div>'
    +'<div class="crow">'
      +'<span class="seg">'
        +BOARD_CONDS.map(c=>'<button class="'+(c[0]===b.cond?'on ':'')+(c[0]==='timed'?'timed':'')
          +'" data-p="'+cid+'" data-i="'+i+'" data-f="cond" data-v="'+c[0]+'">'
          +(c[0]==='timed'?'限時':'一次')+'</button>').join('')
      +'</span>'
      +'<select style="flex:1" class="'+(b.dun?'':'unset')+'" data-p="'+cid+'" data-i="'+i+'" data-f="dun">'
        +'<option value="">＋選副本</option>'
        +BOARD_DUNS.map(k=>'<option'+(k===b.dun?' selected':'')+'>'+esc(k)+'</option>').join('')
      +'</select>'
    +'</div>'
    +'<div class="shrow">'
      +ps.filter(x=>x.id!==r.p.id).map(function(x){
        const on=(b.sh||[]).indexOf(x.id)>=0;
        return '<button class="shbtn'+(on?' on':'')+'" data-p="'+cid+'" data-i="'+i
          +'" data-f="sh" data-v="'+x.id+'">'+esc(x.name)+'</button>';
      }).join('')
    +'</div>'
  +'</div>';
}

function draw(){
  const ps=people();
  const rows=allChars(true);          // 一列一隻角色
  let usable=0, doneN=0;
  const load={}; ps.forEach(p=>load[p.id]={n:0,done:0});
  rows.forEach(function(r){
    boardOf(r.c.id).s.forEach(function(b){
      if(!b.item) return;
      usable++; if(b.done) doneN++;
      // 持有角色的主人要打一份，分享到的每個成員也各一份
      [r.p.id].concat(b.sh||[]).forEach(function(w){ if(load[w]){ load[w].n++; if(b.done) load[w].done++; } });
    });
  });

  document.getElementById('left').innerHTML=(usable-doneN)+'<small>張沒破</small>';
  document.getElementById('week').textContent=
    curWeek()+' 起 · 每'+WD[DB.cfg.resetDay]+' '+(DB.cfg.resetHour??9)+':00 重置';

  const tot={}; BOARD_ITEMS.forEach(k=>tot[k]={n:0,done:0});
  rows.forEach(r=>boardOf(r.c.id).s.forEach(b=>{
    if(!b.item||!tot[b.item]) return;
    const c=1+((b.sh||[]).length);
    tot[b.item].n+=c; if(b.done) tot[b.item].done+=c;
  }));
  const chips=BOARD_ITEMS.filter(k=>tot[k].n)
    .map(k=>'<span class="tchip"><b>'+esc(k)+'</b><span class="n">'+tot[k].done+'/'+tot[k].n+'</span></span>').join('');
  const pload=ps.filter(p=>load[p.id].n)
    .map(p=>'<span class="tchip"><b>'+esc(p.name)+' 要打</b><span class="n">'+load[p.id].done+'/'+load[p.id].n+'</span></span>').join('');
  document.getElementById('totals').innerHTML =
    (chips?'<span class="tlabel">全隊獎勵（含分享的份）</span>'+chips:'')
    +(pload?'<span class="tlabel" style="margin-left:10px">每人負擔</span>'+pload:'');

  document.getElementById('people').innerHTML = '<section>'+rows.map(function(r){
    const e=boardOf(r.c.id);
    const own=e.s.filter(b=>b.item).length, dn=e.s.filter(b=>b.item&&b.done).length;
    return '<div class="prow"><div class="pname">'
      +'<span class="who">'+esc(r.p.name)+'</span>'
      +'<h2>'+esc(charLabel(r.p,r.c))+'</h2>'
      +'<span class="st">登記 <b>'+own+'</b> 張<br>破了 <b>'+dn+'</b> 張</span>'
      +(own?'<button class="allbtn'+(dn===own?' on':'')+'" data-all="'+r.c.id+'">'
            +(dn===own?'✓ 全破了':'整排標破')+'</button>':'')
      +'</div><div class="cards">'
      + e.s.map((b,i)=>card(r,b,i)).join('')
      +'</div></div>';
  }).join('')+'</section>';

  const byDun={};
  rows.forEach(function(r){
    boardOf(r.c.id).s.forEach(function(b){
      if(!b.item || b.done || !b.dun) return;
      (byDun[b.dun]=byDun[b.dun]||[]).push({owner:r,b:b});
    });
  });
  document.getElementById('byrun').innerHTML = BOARD_DUNS.filter(d=>byDun[d]).map(function(d){
    const list=byDun[d];
    return '<div class="run"><h4>'+esc(d)+'<span>'+list.length+' 張</span></h4>'
      +list.map(function(x){
        const names=(x.b.sh||[]).map(id=>(people().find(p=>p.id===id)||{}).name).filter(Boolean);
        return '<div class="b"><b>'+esc(x.b.item)+'</b>'
          +' <span class="own">· '+esc(x.owner.p.name)+'·'+esc(charLabel(x.owner.p,x.owner.c))+'的</span>'
          +(names.length?' <span class="sh">＋'+esc(names.join('、'))+'</span>':'')
          +(x.b.cond==='timed'?'<span class="timed">限時</span>':'')+'</div>';
      }).join('')+'</div>';
  }).join('') || '<div class="run" style="color:var(--sub)">還沒有待破的板子 —— 上面把刷到的填進來，這裡會照副本整理好。</div>';

  document.getElementById('foot').innerHTML=
    '每隻角色每週刷 6 張。填法：每張卡選獎勵就算登記了，再點「一次／限時」和副本。'
    +'打完一輪按名字下面的「整排標破」，這隻角色登記的板子會全部標破（再按一次取消）。'
    +'分享點隊友名字（藍色＝已分享，最多 3 人，一起打大家都拿，各佔各的 6 張額度）。'
    +'打完按「沒破」變「✓ 破了」。每'+WD[DB.cfg.resetDay]+' '+(DB.cfg.resetHour??9)+':00 自動翻新，即時同步全隊。';
}

document.getElementById('people').addEventListener('click', function(e){
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.all){
    // 打完一輪：這隻角色已登記的板子整排標破；已經全破就整排取消
    const cid=t.dataset.all, ee=boardOf(cid);
    const filled=ee.s.filter(b=>b.item);
    const allDone=filled.length && filled.every(b=>b.done);
    ee.s.forEach(b=>{ if(b.item) b.done=!allDone; });
    ee.t=nowMs(); saveDB(); draw(); return;
  }
  const pid=t.dataset.p, i=+t.dataset.i, f=t.dataset.f;
  if(!pid||!f) return;
  if(f==='done'){ const b=boardOf(pid).s[i]; setBoardSlot(pid,i,{done:!b.done}); }
  else if(f==='cond'){ setBoardSlot(pid,i,{cond:t.dataset.v}); }
  else if(f==='sh'){
    const sh=(boardOf(pid).s[i].sh||[]).slice();
    const at=sh.indexOf(t.dataset.v);
    if(at>=0) sh.splice(at,1);
    else{ if(sh.length>=BOARD_SHARE_MAX){ alert('一張板子最多分享給 '+BOARD_SHARE_MAX+' 個人。'); return; }
          sh.push(t.dataset.v); }
    setBoardSlot(pid,i,{sh:sh});
  } else return;
  draw();
});
document.getElementById('people').addEventListener('change', function(e){
  const t=e.target; if(t.tagName!=='SELECT') return;
  const pid=t.dataset.p, i=+t.dataset.i, f=t.dataset.f;
  if(!pid||!f) return;
  if(f==='item'){
    const patch={item:t.value};
    if(!t.value) Object.assign(patch,{dun:'',sh:[],done:false,cond:'once'});
    setBoardSlot(pid,i,patch);
  }else setBoardSlot(pid,i,{[f]:t.value});
  draw();
});

function clearWeekBoard(){
  if(!confirm('清空本週所有角色的板子？（會同步給全隊）')) return;
  DB.board[curWeek()]={};
  allChars(true).forEach(r=>{ boardOf(r.c.id).t=nowMs(); });
  saveDB(); draw();
}

Sync.onChange(function(st){
  const dot=document.getElementById('sdot'), txt=document.getElementById('stxt');
  if(!dot) return;
  dot.className='dot'+(st.busy?' busy':st.dirty?' dirty':st.ok?' live':'');
  txt.textContent = st.busy?'同步中':st.dirty?'未上傳':st.ok?'已同步':'未設定';
});
if(Sync.ready()){ Sync.pull(true).then(draw); Sync.startPolling(Sync.status().canWrite?60:240); }
window.onSynced=draw;

draw();
</script>
</body>
</html>
